# Deploys the NSF theme, the NSF plugin (with its built blocks) and the Frost
# parent theme to a WP Engine environment over the SSH gateway. WordPress
# core, wp-config.php and the database stay WP Engine's; the local SQLite
# drop-in is never sent. See docs/deploy.md.
#
# Needs, in the repo's Settings > Secrets and variables > Actions:
# - secret WPE_SSHG_KEY_PRIVATE: private half of a key whose public half is in
#   the WP Engine User Portal (Profile > SSH keys)
# - variable WPE_ENV: the environment name (the part before .wpengine.com)
# Until WPE_ENV is set, pushes skip the deploy.
name: Deploy to WP Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: wpengine-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.WPE_ENV != ''
    runs-on: ubuntu-latest
    env:
      FROST_VERSION: v1.0.10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build blocks
        run: |
          npm ci
          npm run build

      - name: Copy the taxonomy term list into the plugin
        run: |
          mkdir -p wp-content/plugins/nsf/data
          cp content/taxonomy-terms.json wp-content/plugins/nsf/data/

      - name: Fetch Frost
        run: |
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$FROST_VERSION" https://github.com/wpengine/frost.git wp-content/themes/frost
          rm -rf wp-content/themes/frost/.git

      - name: Deploy the NSF plugin
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ vars.WPE_ENV }}
          SRC_PATH: wp-content/plugins/nsf/
          REMOTE_PATH: wp-content/plugins/nsf/
          FLAGS: -azvr --inplace --delete --exclude=node_modules --exclude=src --exclude=*.map --exclude=.DS_Store
          PHP_LINT: true
          CACHE_CLEAR: false

      - name: Deploy the NSF theme
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ vars.WPE_ENV }}
          SRC_PATH: wp-content/themes/nsf/
          REMOTE_PATH: wp-content/themes/nsf/
          FLAGS: -azvr --inplace --delete --exclude=*.map --exclude=.DS_Store
          PHP_LINT: true
          CACHE_CLEAR: false

      - name: Deploy Frost and clear the cache
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ vars.WPE_ENV }}
          SRC_PATH: wp-content/themes/frost/
          REMOTE_PATH: wp-content/themes/frost/
          FLAGS: -azvr --inplace --delete
          CACHE_CLEAR: true
